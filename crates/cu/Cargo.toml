[package]
name = "ccp-cu"
description = "Compute Unit of the capacity commitment prover for the Fluence protocol"
version = "0.16.7"
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
path = "src/lib.rs"
doctest = false

[dependencies]
ccp-config.workspace = true
ccp-cu-rpc-client.workspace = true
ccp-randomx.workspace = true
ccp-msr.workspace = true
ccp-shared.workspace = true
ccp-utils.workspace = true
cpu-utils.workspace = true

serde.workspace = true
tokio.workspace = true
tokio.features = ["time", "io-util", "fs"]
futures.workspace = true

anyhow.workspace = true
log.workspace = true
nonempty.workspace = true
tempfile.workspace = true
thiserror.workspace = true
itertools.workspace = true

tokio-util.workspace = true
libc.workspace = true
errno.workspace = true
page_size.workspace = true
sizes = "0.1.3"

[dev-dependencies]
ccp-test-utils.workspace = true
env_logger.workspace = true
maplit.workspace = true
tempdir.workspace = true
tokio.workspace = true
test-log.workspace = true
rand.workspace = true
rand.features = ["small_rng"]
