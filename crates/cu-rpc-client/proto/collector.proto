syntax = "proto3";

package cu_rpc_client;

message RpcEpochParameters {
    string difficulty = 1;
    string global_nonce = 2;
}

message RpcProof {
    RpcEpochParameters epoch = 1;
    string cu_id = 2;
    string local_nonce = 3;
    string result_hash = 4;
}

message HashRate {
    uint64 checked_hashes_count = 1;
    uint64 found_proofs_count = 2;
    // TODO how to account parallel execution for both values?
    float cc_job_duration_secs = 3;
    // TODO how to account parallel execution for both values?
    float cache_creation = 4;
    float dataset_initialization = 5;
}

message ReportRequest {
    repeated RpcProof proofs = 1;
    repeated HashRate metrics = 2;
}

message ReportResponse {
    // empty
}


service Collector {
    rpc report(ReportRequest) returns (ReportResponse) {}
}
